name: Cloud image smoke test

on:
  push:
    branches: [codex/cloud-deployment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t imageppt-cloud .
      - name: Verify PPT Master and project isolation
        run: |
          docker run --rm \
            -e IMAGE2EDITABLEPPT_PUBLIC_SHARED=0 \
            -v "$PWD/backend/tests:/checks:ro" \
            --entrypoint python imageppt-cloud -m pytest -q /checks/test_text_pptx.py /checks/test_shared_access.py
      - name: Verify OCR and Simplified Chinese fonts
        run: |
          docker run --rm -i --entrypoint python imageppt-cloud - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from app.services.ocr.service import OCRService
          from app.services.typography.font_raster import font_face

          font = font_face("msyh.ttc", 43)
          assert "SC" in font.getname()[0]
          sample = Path("/tmp/ocr.png")
          image = Image.new("RGB", (560, 100), "white")
          ImageDraw.Draw(image).text((20, 20), "Editable PPT", fill="black", font=font)
          image.save(sample)
          assert "Editable" in " ".join(item.text for item in OCRService("rapidocr").recognize(sample))
          PY
      - name: Verify frontend and API start together
        run: |
          docker run -d --name imageppt -p 127.0.0.1:10000:10000 imageppt-cloud
          trap 'docker logs imageppt' EXIT
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:10000/api/health
          curl --fail --silent http://127.0.0.1:10000/ | grep 'Image2EditablePPT'
          curl --fail --silent -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:10000/api/projects | grep '"imageCount":0'
